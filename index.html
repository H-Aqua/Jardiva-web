<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sitio no disponible</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: #F8F7F3; color: #2B2B2B; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #141815; color: #E8E8E4; } }
  main { max-width: 440px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0; opacity: .75; }
</style>
</head>
<body>
<main>
  <h1>Sitio temporalmente no disponible</h1>
  <p>Este sitio web está desactivado de momento.</p>
  <p lang="en" style="margin-top:16px">This website is temporarily unavailable.</p>
</main>
</body>
</html>
